name: Diagnosticar fuente de exámenes reales
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-fuente-examen.yml']
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar API de lectura de preguntas
        run: |
          python - <<'PY'
          import urllib.request, json
          urls=[
            'https://testsas.es/wp-json/wp/v2/types/wpts_question',
            'https://testsas.es/wp-json/wp/v2/wpts_question?include=573&_fields=id,title,content,meta,acf',
            'https://testsas.es/wp-json/wp/v2/wpts_question/573?_fields=id,title,content,meta,acf']
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'Origin':'https://pitersc10.github.io','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=15) as res:
                data=json.loads(res.read(160000).decode('utf-8'))
                item=data[0] if isinstance(data,list) and data else data
                print('RESULT',url,res.status,'CORS',res.headers.get('Access-Control-Allow-Origin'))
                print('KEYS',list(item)[:30] if isinstance(item,dict) else type(item).__name__)
                if isinstance(item,dict):
                  print('DETAIL','META',list(item.get('meta',{}))[:30] if isinstance(item.get('meta'),dict) else None,
                        'CONTENT_LEN',len(str(item.get('content',''))),'REST_BASE',item.get('rest_base'))
            except Exception as e:print('FAIL',url,str(e)[:240])
          PY
