name: Diagnosticar fuente de exámenes reales
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-fuente-examen.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar acceso y permiso de inserción
        run: |
          python - <<'PY'
          import urllib.request,re
          hosts=['https://testsas.es/tecnico-radiodiagnostico/','https://escapa.es/examenes/tecnico-educacion-participacion-comunitaria?ope=tecnico-radiodiagnostico']
          for u in hosts:
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 RADIOSASAcademy Educational Link Check'})
              with urllib.request.urlopen(req,timeout=18) as r:
                h=r.read(1800000).decode('utf-8','replace')
                print('URL',u)
                print('HTTP',r.status,'SIZE',len(h),'XFO',r.headers.get('X-Frame-Options'),'CSP',r.headers.get('Content-Security-Policy'),'CORS',r.headers.get('Access-Control-Allow-Origin'))
                print('SCRIPT_SOURCES',re.findall(r'<script[^>]*src=["\\\']([^"\\\']+)',h,re.I)[:15])
                print('CHECK','contains radio test',bool(re.search(r'(?:radiodiagn[oó]stico|examen oficial)',h,re.I)))
                if 'testsas.es' in u:
                  from html.parser import HTMLParser
                  class Inspector(HTMLParser):
                    def __init__(self):super().__init__();self.instances=[]
                    def handle_starttag(self,tag,attrs):
                      a=dict(attrs); cls=a.get('class','');
                      if any(k in cls for k in ['wpts-','test-container']):
                        relevant={k:v[:180] for k,v in a.items() if k in ['class','id'] or k.startswith('data-')}
                        if relevant and len(self.instances)<30:self.instances.append((tag,relevant))
                  ins=Inspector();ins.feed(h)
                  print('EXAM_HTML_ATTRS',ins.instances)

                print('MARKERS',[(w,bool(re.search(w,h,re.I))) for w in ['test-sas','examen.oficial','data-test','pregunta','window\\.','admin-ajax','wp-json','testsas','quiz','cuestionario']])
                for key in ['Examen oficial SAS 2025','data-test-id','tests-sas','window.tests','admin-ajax.php']:
                  idx=h.lower().find(key.lower())
                  if idx!=-1:
                    segment=h[max(0,idx-250):idx+900]
                    segment=re.sub(r'>[^<>]{40,}<','>[TEXT]<',segment)
                    print('CONTEXT',key,segment[:950].replace('\\n',' ').replace('\\r',' '))
                print('PAGE_GLOBALS',re.findall(r'window\\.([A-Za-z_$][\\w$]*)\\s*=',h)[:50])
                print('INLINE_IDS',re.findall(r'<script[^>]+id=["\\\']([^"\\\']+extra)["\\\']',h,re.I)[:35])
                for mm in list(re.finditer(r'(?:wp-json|admin-ajax|testsSas|wpts|rest_url|restUrl)',h,re.I))[-12:]:
                  excerpt=h[max(0,mm.start()-85):mm.start()+260]
                  excerpt=re.sub(r'>[^<>]{35,}<','>[TEXT]<',excerpt)
                  print('API_CONTEXT',excerpt.replace('\\n',' ')[:320])
                if 'testsas.es' in u:
                  js='https://testsas.es/wp-content/cache/min/1/wp-content/plugins/tests-sas/assets/js/frontend.js?ver=1792449785'
                  req2=urllib.request.Request(js,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req2,timeout=20) as res:
                    source=res.read(400000).decode('utf-8','replace')
                    print('JS_INFO',len(source),res.status)
                    print('API_MARKERS',[(a,len(re.findall(a,source,re.I))) for a in ['wp-json','admin-ajax','fetch\\(','ajax\\(','nonce','endpoint','question','preguntas','wpts']])
                    for needle in ['wp-json','admin-ajax','wpts_ajax','ajax_url','apiUrl','restUrl','action:','questions']:
                      ix=source.lower().find(needle.lower())
                      if ix>=0:print('JS_CONTEXT',needle,source[max(0,ix-100):ix+300].replace('\\n',' ')[:400])
                  from urllib.parse import urlencode
                  for endpoint in ['https://testsas.es/wp-json/','https://testsas.es/wp-json/wpts/v1/','https://testsas.es/wp-admin/admin-ajax.php']:
                    try:
                      rq=urllib.request.Request(endpoint,headers={'Origin':'https://pitersc10.github.io','User-Agent':'Mozilla/5.0'},method='GET')
                      with urllib.request.urlopen(rq,timeout=12) as rr:
                        body=rr.read(250000).decode('utf-8','replace')
                        import json
                        try:
                          jj=json.loads(body)
                          routes=list(jj.get('routes',{}).keys()) if isinstance(jj,dict) else []
                          print('REST_ROUTES',endpoint,[v for v in routes if 'wpts' in v or 'quiz' in v or 'test' in v][:30])
                          if endpoint.endswith('/wpts/v1/'):
                            for p,route in jj.get('routes',{}).items():
                              print('REST_SCHEMA',p,[{'methods':e.get('methods'),'args':list(e.get('args',{}))} for e in route.get('endpoints',[])])

                          print('API_KEYS',endpoint,list(jj)[:15] if isinstance(jj,dict) else None)
                        except Exception:print('API_BODY_META',endpoint,len(body),body[:60])
                        print('API_CORS',endpoint,rr.status,rr.headers.get('Access-Control-Allow-Origin'))
                    except Exception as e:print('API_ERROR',endpoint,str(e)[:250])
                  for endpoint in ['https://testsas.es/wp-admin/admin-ajax.php','https://testsas.es/wp-json/wpts/v1/']:
                    try:
                      rq=urllib.request.Request(endpoint,headers={'Origin':'https://pitersc10.github.io','Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type'},method='OPTIONS')
                      with urllib.request.urlopen(rq,timeout=12) as rr:
                        print('PREFLIGHT',endpoint,rr.status,rr.headers.get('Access-Control-Allow-Origin'),rr.headers.get('Access-Control-Allow-Methods'))
                    except Exception as e:print('PREFLIGHT_FAIL',endpoint,str(e)[:250])



            except Exception as ex:print('FAIL',u,str(ex)[:320])
          PY
