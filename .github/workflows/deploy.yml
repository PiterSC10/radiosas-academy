name: Verificar y publicar RADIOSAS
on:
  push:
    branches: [main, rx-validation, laboratorio-corporal-1000]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis y pruebas
        run: |
          npm test
          node test-clinica-real.cjs
          node --check examenes-oficiales-v53.js
          node test-oficiales-v53.cjs
          node --check simulacros-historicos-v54.js
          node test-simulacros-historicos-v54.cjs
          node --check sas-examen-original.js
          node test-sas-examen-original.cjs
      - name: Diagnóstico de lectura de cuadernillos SAS (no bloqueante)
        run: |
          node - <<'NODE'
          const u='https://www.sspa.juntadeandalucia.es/servicioandaluzdesalud/sites/default/files/sincfiles/wsas-media-mediafile_sasdocumento/2024/20240210_55018_te_radiodiagnostico.pdf';
          fetch(u,{method:'HEAD',headers:{Origin:'https://pitersc10.github.io'},signal:AbortSignal.timeout(12000)})
            .then(r=>console.log('SAS_CORS_STATUS',r.status,'SAS_CORS_ACAO',r.headers.get('access-control-allow-origin')||'NO_ACAO','SAS_CONTENT_TYPE',r.headers.get('content-type')))
            .catch(e=>console.log('SAS_CORS_CHECK_UNAVAILABLE',e.message));
          const reader='https://r.jina.ai/'+u;
          fetch(reader,{signal:AbortSignal.timeout(24000)}).then(async r=>{const body=await r.text();console.log('JINA_READER_PROBE',r.status,'CORS',r.headers.get('access-control-allow-origin')||'NO_ACAO','BYTES',body.length,'OPTIONS',Array.from(body.matchAll(/^A[).] /gm)).length)}).catch(e=>console.log('JINA_READER_PROBE_UNAVAILABLE',e.message));
          const proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(u);
          fetch(proxy,{signal:AbortSignal.timeout(16000)}).then(async r=>{const b=await r.arrayBuffer();console.log('ALLORIGINS_PDF_PROBE',r.status,'CORS',r.headers.get('access-control-allow-origin')||'NO_ACAO','BYTES',b.byteLength,'MAGIC',new TextDecoder().decode(b.slice(0,5)))}).catch(e=>console.log('ALLORIGINS_PDF_UNAVAILABLE',e.message));
          NODE
      - name: Instalar navegador de pruebas
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium webkit
      - name: Probar laboratorio en navegadores y móvil
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laboratorio-browser-results
          path: browser-results/
      - name: Preparar web
        run: |
          mkdir -p dist
          cp index.html app.js data.js bank-master.js bank-5000.js lab-data.js lab-atlas.js rx-torax-esquema.svg styles.css clinica-real-banco.js clinica-real.js clinica-real.css examenes-oficiales-v53.js examenes-oficiales-v53.css simulacros-historicos-v54.js simulacros-historicos-v54.css sas-examen-original.js sas-examen-original.css manifest.webmanifest sw.js favicon.svg .nojekyll dist/
          cp paula-logo.svg paula-logo.png paula-avatar.png paula-hero.webp paula-social-card.svg paula-social-card.png vista-previa-paula-edition.png dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
